[package]
name = "tree-sitter-blueprint"
description = "Gtk Blueprint"
version = "0.1.0"
authors = ["PaladinDev <paladindev@altlinux.org>"]
license = "GPL"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "blueprint"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/spikedpaladin/tree-sitter-blueprint"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
